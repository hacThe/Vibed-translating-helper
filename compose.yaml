name: vn-to-english

x-backend: &backend
  build:
    context: ./backend
  environment:
    DATABASE_URL: postgresql://postgres:postgres@db:5432/vn_to_english_development
    QUEUE_DATABASE_URL: postgresql://postgres:postgres@db:5432/vn_to_english_queue_development
    TEST_DATABASE_URL: postgresql://postgres:postgres@db:5432/vn_to_english_test
    RAILS_ENV: development
    SEED_USER_EMAIL: ${SEED_USER_EMAIL:-}
    SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
    AI_PROVIDER: ${AI_PROVIDER:-fake}
    AI_MODEL: ${AI_MODEL:-fake-v1}
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
    DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
    AI_REQUEST_TIMEOUT_SECONDS: ${AI_REQUEST_TIMEOUT_SECONDS:-120}
  volumes:
    - ./backend:/app
  depends_on:
    db:
      condition: service_healthy

services:
  frontend:
    build:
      context: ./frontend
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - api

  api:
    <<: *backend
    command: bin/rails server -b 0.0.0.0
    ports:
      - "3000:3000"

  worker:
    <<: *backend
    command: bin/jobs start

  db:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  frontend_node_modules:
  postgres_data:
